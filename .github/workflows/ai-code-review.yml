name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

env:
  MAX_TOKENS: '2000'
  MAX_FILES: '100'
  MAX_LINES: '1800'
  EXCLUDE_GLOBS: |
    **/node_modules/**
    **/build/**
    **/out/**
    **/target/**
    **/bin/**
    **/*.jar
    **/*.class
    **/*.log
    **/*.png
    **/*.jpg
    **/*.svg
    **/*.gif
    **/*.zip
    **/*.map
    **/*.pdf
    **/*Test.java

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Check trigger
        id: gate
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"

          if [[ "$EVENT" == "issue_comment" ]]; then
            BODY="${{ github.event.comment.body }}"
            if [[ ! "$BODY" =~ ^/ai-review ]]; then
              echo "not_needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ "$EVENT" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "not_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Exit if not needed
        if: steps.gate.outputs.not_needed == 'true'
        run: echo "⏭️ Skip AI review"

      - name: Checkout repo
        if: steps.gate.outputs.not_needed != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SHAs
        id: shas
        if: steps.gate.outputs.not_needed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            PR="${{ github.event.pull_request.number }}"
          else
            PR="${{ github.event.issue.number }}"
            BASE=$(gh api repos/${{ github.repository }}/pulls/$PR --jq .base.sha)
            HEAD=$(gh api repos/${{ github.repository }}/pulls/$PR --jq .head.sha)
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Decide Model
        id: model
        run: |
          set -euo pipefail

          MODEL="gpt-4o-mini"

          PR=${{ steps.shas.outputs.pr }}

          LABELS=$(gh pr view $PR --json labels --jq '.labels[].name')

          if echo "$LABELS" | grep -qi "high-priority"; then
            MODEL="gpt-4o"
          fi

          LINES=$(git diff --unified=0 "${{ steps.shas.outputs.base }}" "${{ steps.shas.outputs.head }}" | grep -E '^(\+|\-)' | wc -l | tr -d ' ')
          if (( LINES > 400 )); then
            MODEL="gpt-4o"
          fi

          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter files
        id: files
        if: steps.gate.outputs.not_needed != 'true'
        run: |
          BASE="${{ steps.shas.outputs.base }}"
          HEAD="${{ steps.shas.outputs.head }}"

          mapfile -t DIFF < <(git diff --name-only "$BASE" "$HEAD")

          EXCLUDES=()
          while IFS= read -r pat; do [[ -n "$pat" ]] && EXCLUDES+=("$pat"); done <<< "$EXCLUDE_GLOBS"

          FILTERED=()
          for f in "${DIFF[@]}"; do
            SKIP=0
            for g in "${EXCLUDES[@]}"; do
              [[ $f == $g || $f == */$g ]] && SKIP=1 && break
            done
            (( SKIP == 0 )) && FILTERED+=("$f")
          done

          [[ ${#FILTERED[@]} -gt ${MAX_FILES} ]] && FILTERED=("${FILTERED[@]:0:${MAX_FILES}}")

          printf "%s\n" "${FILTERED[@]}" > files.txt
          echo "list=$(jq -R -s -c 'split(\"\\n\")[:-1]' files.txt)" >> "$GITHUB_OUTPUT"

      - name: Create patch JSON
        id: diff
        if: steps.gate.outputs.not_needed != 'true'
        run: |
          BASE="${{ steps.shas.outputs.base }}"
          HEAD="${{ steps.shas.outputs.head }}"
          
          LINES=$(git diff --unified=0 "$BASE" "$HEAD" | grep -E '^(\+|\-)' | wc -l | tr -d ' ')
          
          git diff "$BASE" "$HEAD" > patch.txt
          
          if (( LINES > ${MAX_LINES} )); then
            head -n ${MAX_LINES} patch.txt > patch.trim.txt
            mv patch.trim.txt patch.txt
            jq -n '{oversize:true}' > diff.json
            echo "oversize=true" >> "$GITHUB_OUTPUT"
          else
            jq -n '{oversize:false}' > diff.json
            echo "oversize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build prompt
        run: |
          PR=${{ steps.shas.outputs.pr }}
          
          {
            echo "당신은 시니어 Spring Boot / Java 백엔드 코드 리뷰어이다."
            echo "대상: Java 17+, Spring Boot 3.x, JPA/Hibernate, Spring Security, REST API, JUnit/Mockito."
            echo "항상 한국어로 답변하며, 빈 리뷰나 모호한 답변을 절대 생성하지 않는다."
            echo "변경된 diff 기반으로 실제 동작/설계/성능/버그 가능성을 집중적으로 평가한다."
            echo "출력은 절대로 비워두지 말고, 반드시 내용이 있어야 한다."
            echo ""
            echo "출력 형식은 반드시 다음을 따른다:"
            echo ""
            echo "1) ### 🧠 요약"
            echo "- 이 PR에서 가장 중요한 리스크 1~3개를 간단히 정리한다."
            echo ""
            echo "2) ### ⚠️ 세부 코드 리뷰"
            echo "- [파일명:줄번호] 문제 → 원인 → 개선안 → 필요 시 코드 예시"
            echo "- 도메인 설계, 계층 분리, JPA 매핑, 지연 로딩, 쿼리 성능, 트랜잭션, 예외 처리, 유효성 검사, REST 규약 준수"
            echo "- 코드가 좋아 보이는 부분도 근거를 들어 설명한다(단순 칭찬 금지)."
            echo ""
            echo "3) ### 🧪 테스트 제안"
            echo "- 이 PR에서 보완되면 좋은 테스트 케이스를 제안한다."
            echo ""
            echo "리뷰는 반드시 실무 수준의 근거를 포함하며, 모든 변경 부분에 대해 의견을 제시한다."
          } > system.txt
          
          : > user.txt
          
          echo "<PR_META>" >> user.txt
          gh api repos/${{ github.repository }}/pulls/$PR --jq '{title:.title, author:.user.login, body:.body}' >> user.txt
          echo "</PR_META>" >> user.txt
          
          echo "<DIFF_PATCH>" >> user.txt
          cat patch.txt >> user.txt
          echo "</DIFF_PATCH>" >> user.txt

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Call OpenAI
        id: llm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          MODEL=${{ steps.model.outputs.model }}

          jq -n \
            --arg model "$MODEL" \
            --rawfile sys system.txt \
            --rawfile usr user.txt \
            --argjson mt ${MAX_TOKENS} \
            '{
            model: $model,
            messages: [
              { role: "system", content: $sys },
              { role: "user", content: $usr }
            ],
            max_tokens: $mt,
            temperature: 0.2
          }' > payload.json

          curl -sS https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            --data-binary @payload.json \
            -o llm_response.json
          
          echo "LLM ERROR:" > llm_error.txt
          cat llm_response.json | jq '.error // empty' >> llm_error.txt
          
          CONTENT=$(jq -r '.choices[0].message.content // empty' llm_response.json 2>/dev/null || echo "")
  
          if [[ -z "$CONTENT" ]]; then
          echo "⚠️ 모델 응답 없음" > llm_content.txt
          echo "--- LLM Error Detail ---" >> llm_content.txt
          jq '.error // empty' llm_response.json >> llm_content.txt
          else
          echo "$CONTENT" > llm_content.txt
          fi

      - name: Comment PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.shas.outputs.pr }}

          {
            echo "### 🤖 AI Code Review"
            echo "<details><summary>View results</summary>"
            echo ""
            cat llm_content.txt
            echo ""
            echo "</details>"
          } > comment.txt

          gh api repos/${{ github.repository }}/issues/$PR/comments \
            -f body="$(cat comment.txt)"
