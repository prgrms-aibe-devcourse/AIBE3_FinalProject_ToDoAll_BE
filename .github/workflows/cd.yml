name: CD pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  Deploy-Compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release tag
        id: get_latest_tag
        uses: actions-ecosystem/action-get-latest-tag@v1

      - name: Copy docker-compose files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_SSH_PORT }}
          source: |
            server/docker-compose-base.yml
            server/docker-compose-blue.yml
            server/docker-compose-green.yml
          target: /home/ubuntu/jobda/
          overwrite: true

      # Blue/Green 배포 실행
      - name: Deploy Blue/Green via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_SSH_PORT }}
          script: |
            set -e
            cd /home/ubuntu/jobda

            LATEST_TAG="${{ steps.get_latest_tag.outputs.tag }}"

            echo "=== 환경변수 파일 생성 ==="
            cat > .env << EOF
            OWNER_NAME=${{ github.repository_owner }}
            IMAGE_TAG=$LATEST_TAG
            AWS_RDS_URL=${{ secrets.AWS_RDS_URL }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            AWS_RDS_ROOT_PASSWORD=${{ secrets.AWS_RDS_ROOT_PASSWORD }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            OPENAI_API_KEY_AI=${{ secrets.OPENAI_API_KEY_AI }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_ACCESS_SECRET_KEY=${{ secrets.AWS_ACCESS_SECRET_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
            EOF
            
            echo "=== 배포 시작: 태그 $LATEST_TAG ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
  
            echo "=== Blue/Green 무중단 배포 시작 ==="
            /home/ubuntu/deploy/deploy.sh $LATEST_TAG
  
            echo "=== 배포 완료 ==="