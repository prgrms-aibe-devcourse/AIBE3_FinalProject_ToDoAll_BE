name: CI pipeline

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: write
  packages: write

jobs:
  Test-And-Build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: ci
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Check .gitignore - Find changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi

          # act 환경에서 PR SHA가 비거나 merge-base 불가하면 develop 기준으로 강제 3-dot
          if [[ "${ACT:-}" == "true" ]]; then
            if [[ -z "${BASE:-}" || -z "${HEAD:-}" ]] || ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then
              git fetch --no-tags --prune origin +refs/heads/develop:refs/remotes/origin/develop
              BASE=$(git merge-base HEAD origin/develop)
              HEAD=HEAD
            fi
          fi

          # 값이 비었거나 merge-base 불가하면 2-dot로 폴백 
          if [[ -n "${BASE:-}" && -n "${HEAD:-}" ]] && git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then 
            git diff --name-only "$BASE...$HEAD" > changed.txt 
          else 
            git diff --name-only "${BASE:-HEAD^}" "${HEAD:-HEAD}" > changed.txt
            echo "BASE 혹은 HEAD가 비어있거나 공통 조상이 없어 2-dot 비교로 대체하였습니다."
          fi

          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Check .gitignore - Show result
        run: |
          echo "Changed count: ${{ steps.diff.outputs.count }}"
          cat changed.txt || true

          # --no-index: 트래킹된 파일이라도 .gitignore 규칙에 매치되면 감지
          if git check-ignore --no-index -v --stdin < changed.txt; then
            echo "::error .gitignore violation:: PR에 .gitignore의 파일이 포함되어 있습니다."
            exit 1
          fi

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install MySQL client (for act / local)
        if: env.ACT == 'true'
        run: |
          if ! command -v mysqladmin >/dev/null 2>&1; then
            echo "mysqladmin not found, installing client..."
            apt-get update
            apt-get install -y default-mysql-client
          else
            echo "mysqladmin already installed."
          fi

      - name: Wait for MySQL to be fully ready
        run: |
          echo "Waiting for MySQL to be fully ready..."
          for i in {1..40}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" --silent; then
              echo "MySQL is READY!"
              break
            fi
            echo "Still waiting..."
            sleep 3
          done

      - name: Build with QueryDSL & run tests
        run: ./gradlew clean build --stacktrace

      - name: Upload jar artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jobda-app-jar
          path: build/libs/*.jar

  Make-Tag-And-Release:
    if: github.event_name == 'push'
    needs: Test-And-Build
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: create_tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          release_name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}

  Compose-Build-And-Push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [Make-Tag-And-Release, Test-And-Build]

    env:
      OWNER_NAME: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ needs.Make-Tag-And-Release.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: jobda-app-jar
          path: build/libs

      - name: Build Docker Compose
        run: |
          docker compose -f docker-compose-cd.yml build
          docker compose -f docker-compose-cd.yml config

      - name: Login to Github Container Registry (ghcr)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Compose
        run: |
          docker compose -f docker-compose-cd.yml push app