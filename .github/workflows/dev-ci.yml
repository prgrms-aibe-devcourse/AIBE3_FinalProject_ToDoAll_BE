name: Dev CI pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: ci
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/jobda_db
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Check .gitignore - Find changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi

          if [[ "${ACT:-}" == "true" ]]; then
            if [[ -z "${BASE:-}" || -z "${HEAD:-}" ]] || ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then
              git fetch --no-tags --prune origin +refs/heads/develop:refs/remotes/origin/develop
              BASE=$(git merge-base HEAD origin/develop)
              HEAD=HEAD
            fi
          fi

          if [[ -n "${BASE:-}" && -n "${HEAD:-}" ]] && git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then
            git diff --name-only "$BASE...$HEAD" > changed.txt
          else
            git diff --name-only "${BASE:-HEAD^}" "${HEAD:-HEAD}" > changed.txt
            echo "BASE 혹은 HEAD 계산 실패 → 2-dot 비교로 대체"
          fi

          # Output for later steps
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Check .gitignore - Show result
        run: |
          echo "Changed count: ${{ steps.diff.outputs.count }}"
          cat changed.txt || true

          git diff --name-status "${{ steps.diff.outputs.base }}...${{ steps.diff.outputs.head }}" \
            | grep "^A" | cut -f2 > added_only.txt || true

          echo "===== Added Files Only ====="
          cat added_only.txt || true

          if git check-ignore --no-index -v --stdin < added_only.txt; then
            echo "::error file=.gitignore:: PR에 .gitignore 규칙에 포함된 파일이 추가되었습니다."
            exit 1
          fi

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install MySQL client (for act / local)
        if: env.ACT == 'true'
        run: |
          if ! command -v mysqladmin >/dev/null 2>&1; then
            echo "mysqladmin not found, installing client..."
            apt-get update
            apt-get install -y default-mysql-client
          else
            echo "mysqladmin already installed."
          fi

      - name: Wait for MySQL to be fully ready
        run: |
          echo "Waiting for MySQL to be fully ready..."
          for i in {1..40}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" --silent; then
              echo "MySQL is READY!"
              break
            fi
            echo "Still waiting..."
            sleep 3
          done

      - name: Build with QueryDSL & run tests
        run: ./gradlew clean build --stacktrace

      - name: Build Docker Compose (dev)
        run: |
          docker compose -f docker-compose-dev.yml build
          docker compose -f docker-compose-dev.yml config