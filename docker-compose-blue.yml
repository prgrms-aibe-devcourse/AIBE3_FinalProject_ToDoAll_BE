version: "3.8"

services:
  jobda-app-blue:
    image: ghcr.io/${OWNER_NAME}/jobda-app:${IMAGE_TAG}
    container_name: jobda-app-blue
    ports:
      - "8080:8080"
      - "9080:8081"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: cd
    networks:
      - jobda-net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

networks:
  jobda-net:
    external: true