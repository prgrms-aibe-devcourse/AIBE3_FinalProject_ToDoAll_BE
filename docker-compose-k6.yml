version: "3.8"

services:
  k6:
    image: grafana/k6:0.49.0
    container_name: jobda-k6
    volumes:
      - ./k6/scripts:/scripts
      - ./k6/reports:/reports
    environment:
      BASE_URL: http://jobda-app:8080
    networks:
      - jobda-net
    entrypoint: ["k6"]
    tty: true

networks:
  jobda-net:
    external: true