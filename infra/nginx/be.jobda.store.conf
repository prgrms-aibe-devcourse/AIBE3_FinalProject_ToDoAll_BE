server {
    listen 80;
    server_name be.jobda.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name be.jobda.store;

    ssl_certificate /etc/letsencrypt/live/be.jobda.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/be.jobda.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # root → swagger
    location = / {
        return 302 /swagger-ui/index.html;
    }

    # SSE (알림 구독)
    location /api/v1/notifications/subscribe {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Backend API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }
}