spring:
  application:
    name: jobda-app

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:mysql://${AWS_RDS_URL}:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
    username: admin
    password: ${AWS_RDS_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  data:
    redis:
      host: jobda-redis
      port: 6379
      database: 1
      password:

  elasticsearch:
    uris: http://3.39.210.5:9200

  cache:
    redis:
      time-to-live: 3600000  # 1시간 (ms)

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          auth: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY_AI}
      chat:
        model: gpt-4o-mini
    mcp:
      server:
        enabled: true
        name: jobda-interview-mcp
        type: sync
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true

  doc:
    swagger-ui:
      path: /swagger-ui/index.html
      url: /v3/api-docs
    api-docs:
      path: /v3/api-docs

mcp:
  base-url: http://3.39.210.5:8090
  summary-path: /api/ai/interviews/generate-summary
  generate-questions-path: /api/ai/interviews/generate-questions


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    com.server.mcp.tool: DEBUG         # InterviewMcpTools
    org.springframework.ai.mcp: DEBUG
    org.springaicommunity.mcp: DEBUG

app:
  email:
    auth-expiry-minutes: 30
    auth-base-url: https://jobda.vercel.app/signup/form
  password-reset:
    expiry-minutes: 30
    frontend-url: https://jobda.vercel.app/reset-password

jwt:
  secret: ${JWT_SECRET}
  access-exp: 3600000
  refresh-exp: 604800000

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_ACCESS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}

management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      group:
        readiness:
          include: ping
        liveness:
          include: ping