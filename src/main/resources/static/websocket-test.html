<!DOCTYPE html>
<html>
<head>
  <title>WebSocket JOIN Test</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>Interview WebSocket JOIN Test</h2>

<button onclick="connect()">Connect with interviewId = 10</button>
<button onclick="disconnect()">Disconnect</button>

<div id="logs"></div>

<script>
  let stompClient = null;

  function log(msg) {
    document.getElementById("logs").innerHTML += "<p>" + msg + "</p>";
  }

  function connect() {
    const socket = new SockJS("http://localhost:8080/ws/interview");
    stompClient = Stomp.over(socket);

    stompClient.connect(
            { interviewId: "10" },   // ★★★★★★ 매우 중요 ★★★★★★
            function() {
              log("Connected to interview 10");
            },
            function(error) {
              log("Error: " + error);
            }
    );
  }

  function disconnect() {
    if (stompClient) stompClient.disconnect();
    log("Disconnected");
  }
</script>
</body>
</html>
