<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::body})}">
<body>
<div>
    <div class="admin-page-header">
        <div>
            <div class="admin-page-title">Dashboard</div>
            <div class="admin-page-subtitle">
                잡다 서비스의 전체 운영 현황을 확인할 수 있는 관리자 대시보드
            </div>
        </div>
    </div>

    <div class="admin-grid admin-grid-4">
        <div class="admin-card">
            <div class="admin-card-header">전체 회원 수</div>
            <div class="metric-value" th:text="${summary.totalUsers}">0</div>
            <div class="metric-label">
                오늘 가입
                <span th:text="${summary.todaySignups}">0</span> 명
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">채용공고</div>
            <div class="metric-value" th:text="${summary.totalJds}">0</div>
            <div class="metric-label">
                OPEN:
                <span th:text="${summary.openJds}">0</span> /
                CLOSED:
                <span th:text="${summary.closedJds}">0</span>
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">이력서</div>
            <div class="metric-value" th:text="${summary.totalResumes}">0</div>
            <div class="metric-label">등록된 전체 이력서 수</div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">면접</div>
            <div class="metric-value" th:text="${summary.totalInterviews}">0</div>
            <div class="metric-label">
                오늘 예정된 면접
                <span th:text="${summary.todayInterviews}">0</span> 건
            </div>
        </div>
    </div>

    <div style="margin-top: 1.25rem;" class="admin-grid admin-grid-2">
        <div class="admin-card">
            <div class="admin-card-header">최근 가입 회원 (Top 5)</div>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>이메일</th>
                        <th>이름</th>
                        <th>가입일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${recentUsers}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.name}"></td>
                        <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recentUsers)}">
                        <td colspan="4" style="text-align: center; color: #9ca3af;">
                            최근 가입 회원 데이터가 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">최근 채용공고 (Top 5)</div>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>제목</th>
                        <th>상태</th>
                        <th>등록일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="jd : ${recentJds}">
                        <td th:text="${jd.id}"></td>
                        <td th:text="${jd.title}"></td>
                        <td th:text="${jd.status}"></td>
                        <td th:text="${#temporals.format(jd.createdAt, 'yyyy-MM-dd')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recentJds)}">
                        <td colspan="4" style="text-align: center; color: #9ca3af;">
                            최근 채용공고 데이터가 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
