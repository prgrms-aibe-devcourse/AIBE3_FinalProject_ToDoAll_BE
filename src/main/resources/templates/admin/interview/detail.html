<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="admin/layout :: layout(~{::body})">
<body>

<div class="admin-page-header">
    <div>
        <div class="admin-page-title">
            인터뷰 상세 <span th:text="'#' + ${interview.id}"></span>
        </div>
        <div class="admin-page-subtitle">
            인터뷰 상태/결과 변경 및 프로필 정보 확인이 가능합니다.
        </div>
    </div>
    <a href="/admin/interviews" class="admin-button admin-button-secondary">목록으로</a>
</div>

<div class="admin-grid admin-grid-2">

    <div class="admin-card">
        <div class="admin-card-header">채용공고 정보</div>
        <div class="admin-card-body">
            <div><strong>ID:</strong> <span th:text="${interview.jdId}"></span></div>
            <div><strong>제목:</strong> <span th:text="${interview.jdTitle}"></span></div>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">이력서 정보</div>
        <div class="admin-card-body">
            <div><strong>ID:</strong> <span th:text="${interview.resumeId}"></span></div>
            <div><strong>이름:</strong> <span th:text="${interview.resumeName}"></span></div>
            <div><strong>이메일:</strong> <span th:text="${interview.resumeEmail}"></span></div>
            <div><strong>전화번호:</strong> <span th:text="${interview.resumePhone}"></span></div>
        </div>
    </div>

</div>


<div class="admin-grid admin-grid-2" style="margin-top:1.25rem;">

    <div class="admin-card">
        <div class="admin-card-header">면접 상태 / 결과</div>
        <div class="admin-card-body">

            <div>
                <strong>현재 상태:</strong> <span th:text="${interview.status}"></span>
                <span th:if="${interview.deleted}" class="badge badge-danger" style="margin-left:.5rem;">삭제됨</span>
            </div>

            <form th:action="@{'/admin/interviews/' + ${interview.id} + '/status'}" method="post" style="margin-top:1rem;">
                <label for="status"><strong>상태 변경</strong></label>
                <select name="status" id="status" class="admin-input">
                    <option th:each="s : ${allStatuses}"
                            th:value="${s}"
                            th:selected="${s == interview.status}"
                            th:text="${s}"></option>
                </select>
                <button class="admin-button admin-button-primary" type="submit">변경</button>
            </form>

            <form th:action="@{'/admin/interviews/' + ${interview.id} + '/result'}" method="post" style="margin-top:1rem;">
                <label for="result"><strong>결과 변경</strong></label>
                <select name="result" id="result" class="admin-input">
                    <option th:each="r : ${allResults}"
                            th:value="${r}"
                            th:selected="${r == interview.result}"
                            th:text="${r}"></option>
                </select>
                <button class="admin-button admin-button-primary" type="submit">변경</button>
            </form>

            <div style="margin-top:1.25rem;">
                <form th:if="${!interview.deleted}"
                      th:action="@{'/admin/interviews/' + ${interview.id} + '/delete'}"
                      method="post" style="display:inline;">
                    <button class="admin-button admin-button-danger">인터뷰 삭제</button>
                </form>

                <form th:if="${interview.deleted}"
                      th:action="@{'/admin/interviews/' + ${interview.id} + '/restore'}"
                      method="post" style="display:inline;">
                    <button class="admin-button admin-button-secondary">복구</button>
                </form>
            </div>

        </div>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">후보자 스킬 & 경력 정보</div>
        <div class="admin-card-body">
            <div>
                <strong>보유 스킬</strong>
                <ul>
                    <li th:each="s : ${interview.skills}" th:text="${s}"></li>
                </ul>
            </div>

            <div style="margin-top:1rem;">
                <strong>부족 스킬</strong>
                <span th:if="${#lists.isEmpty(interview.missingSkills)}">없음</span>
                <ul th:if="${!#lists.isEmpty(interview.missingSkills)}">
                    <li th:each="s : ${interview.missingSkills}" th:text="${s}"></li>
                </ul>
            </div>

            <div style="margin-top:1rem;">
                <strong>경력 요약</strong>
                <ul>
                    <li th:each="e : ${interview.experiences}" th:text="${e}"></li>
                </ul>
            </div>
        </div>
    </div>

</div>

</body>
</html>
