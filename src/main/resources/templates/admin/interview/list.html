<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="admin/layout :: layout(~{::body})">
<body>
<div>
    <div class="admin-page-header">
        <div class="admin-page-title">인터뷰 관리</div>
        <div class="admin-page-subtitle">
            생성된 모든 인터뷰를 확인하고 상세/삭제/복구/상태 변경을 수행할 수 있습니다.
        </div>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>JD 제목</th>
            <th>지원자</th>
            <th>면접관</th>
            <th>상태</th>
            <th>삭제 여부</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="i : ${interviews}">
            <td th:text="${i.id}">1</td>
            <td th:text="${i.jdTitle}">백엔드 개발자</td>
            <td th:text="${i.candidateName}">유승인</td>
            <td th:text="${i.organizerName}">면접관</td>
            <td th:text="${i.status}">WAITING</td>
            <td>
                <span th:if="${i.deleted}" class="badge badge-danger">삭제됨</span>
                <span th:if="${!i.deleted}" class="badge badge-success">정상</span>
            </td>
            <td>
                <a th:href="@{'/admin/interviews/' + ${i.id}}"
                   class="admin-button admin-button-secondary">상세</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
