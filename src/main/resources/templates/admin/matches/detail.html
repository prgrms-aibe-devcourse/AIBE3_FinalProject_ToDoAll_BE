<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="admin/layout :: layout(~{::body})">
<body>
<div>
    <div class="admin-page-header">
        <div>
            <div class="admin-page-title">
                매칭 상세
                <span th:text="'#' + ${match.id}">#1</span>
            </div>
            <div class="admin-page-subtitle">
                JD – 이력서 매칭 상세 정보 및 추천/요약 정보를 확인할 수 있습니다.
            </div>
        </div>
        <div>
            <a href="/admin/matches" class="admin-button admin-button-secondary">
                목록으로
            </a>
        </div>
    </div>

    <div class="admin-grid admin-grid-2">
        <div class="admin-card">
            <div class="admin-card-header">채용공고 정보</div>
            <div class="admin-card-body">
                <div><strong>ID:</strong> <span th:text="${match.jdId}">1</span></div>
                <div><strong>제목:</strong> <span th:text="${match.jdTitle}">AI 백엔드 엔지니어</span></div>
                <div>
                    <strong>상태:</strong>
                    <span th:text="${match.jdStatus}">OPEN</span>
                </div>
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">이력서 정보</div>
            <div class="admin-card-body">
                <div><strong>ID:</strong> <span th:text="${match.resumeId}">3001</span></div>
                <div><strong>이름:</strong> <span th:text="${match.resumeName}">김민준</span></div>
                <div><strong>이메일:</strong> <span th:text="${match.resumeEmail}">email</span></div>
                <div><strong>전화번호:</strong> <span th:text="${match.resumePhone}">010-0000-0000</span></div>
            </div>
        </div>
    </div>

    <div class="admin-grid admin-grid-2" style="margin-top: 1.25rem;">
        <div class="admin-card">
            <div class="admin-card-header">매칭 상태</div>
            <div class="admin-card-body">
                <div style="margin-bottom: .5rem;">
                    <strong>현재 상태:</strong>
                    <span th:text="${match.status}">APPLIED</span>
                    <span th:if="${match.deleted}" class="badge badge-danger" style="margin-left: .5rem;">
                        삭제됨
                    </span>
                </div>
                <div>
                    <strong>지원일:</strong>
                    <span th:text="${#temporals.format(match.appliedAt, 'yyyy-MM-dd HH:mm')}">
                        2025-12-05 12:34
                    </span>
                </div>
                <div>
                    <strong>매칭 점수:</strong>
                    <span th:text="${match.matchScore != null ? match.matchScore : 0}">0.0</span>
                </div>

                <form th:action="@{'/admin/matches/' + ${match.id} + '/status'}"
                      method="post"
                      style="margin-top: 1rem;">
                    <label for="status"><strong>상태 변경</strong></label>
                    <div style="display:flex; gap:.5rem; margin-top:.25rem;">
                        <select id="status" name="status" class="admin-input">
                            <option th:each="s : ${allStatuses}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${s == match.status}">
                            </option>
                        </select>
                        <button type="submit" class="admin-button admin-button-primary">
                            변경
                        </button>
                    </div>
                </form>

                <div style="margin-top: 1rem;">
                    <form th:if="${!match.deleted}"
                          th:action="@{'/admin/matches/' + ${match.id} + '/delete'}"
                          method="post"
                          style="display:inline;">
                        <button type="submit"
                                class="admin-button admin-button-danger">
                            매칭 삭제
                        </button>
                    </form>

                    <form th:if="${match.deleted}"
                          th:action="@{'/admin/matches/' + ${match.id} + '/restore'}"
                          method="post"
                          style="display:inline;">
                        <button type="submit"
                                class="admin-button admin-button-secondary">
                            매칭 복구
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">추천 / 스킬 매칭 정보</div>
            <div class="admin-card-body">
                <div>
                    <strong>스킬 매칭률:</strong>
                    <span th:text="${match.skillMatchRate}">80%</span>
                </div>

                <div style="margin-top:.5rem;">
                    <strong>부족 스킬:</strong>
                    <span th:if="${#lists.isEmpty(match.missingSkills)}">없음</span>
                    <ul th:if="${!#lists.isEmpty(match.missingSkills)}">
                        <li th:each="skill : ${match.missingSkills}"
                            th:text="${skill}">kafka</li>
                    </ul>
                </div>

                <div style="margin-top:.5rem;">
                    <strong>보유 스킬:</strong>
                    <span th:if="${#lists.isEmpty(match.skills)}">없음</span>
                    <ul th:if="${!#lists.isEmpty(match.skills)}">
                        <li th:each="skill : ${match.skills}" th:text="${skill}">spring</li>
                    </ul>
                </div>

                <div style="margin-top:.5rem;">
                    <strong>이력서 요약</strong>
                    <p th:text="${match.resumeSummary}"
                       style="white-space: pre-wrap; margin-top:.25rem;">
                        이력서 요약 내용
                    </p>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
