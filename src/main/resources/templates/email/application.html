<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <title>Applicant WebSocket 테스트</title>
</head>
<body>

<h2>지원자 WebSocket 테스트</h2>

<button onclick="connectWS()">Connect</button>

<hr/>

<button onclick="sendChat()">채팅 보내기</button>
<button onclick="sendNote()">노트 보내기(차단되어야 함)</button>

<pre id="log"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stomp = null;

    function log(msg) {
        document.getElementById("log").textContent += msg + "\n";
    }

    function connectWS() {
        const socket = new SockJS("http://localhost:8080/ws/interview");
        stomp = Stomp.over(socket);

        stomp.connect(
            {
                interviewId: 10
                // JWT 없음 → 지원자!
            },
            () => {
                log("지원자 연결 성공!");

                stomp.subscribe("/topic/interview/10/chat", msg => log("[CHAT] " + msg.body));
                stomp.subscribe("/topic/interview/10/system", msg => log("[SYSTEM] " + msg.body));

                // 지원자는 NOTE 구독 안 함
            },
            (err) => {
                log("연결 실패: " + err);
            }
        );
    }

    function sendChat() {
        stomp.send("/app/interview/10/chat", {}, JSON.stringify({
            senderId: 999,
            sender: "지원자",
            content: "지원자가 보낸 메시지"
        }));
        log("지원자 → 채팅 보냄");
    }

    function sendNote() {
        stomp.send("/app/interview/10/note", {}, JSON.stringify({
            senderId: 999,
            sender: "지원자",
            content: "지원자가 보내려고 한 노트",
            noteId: 5
        }));
        log("지원자 → 노트 전송 시도 (차단 expected)");
    }
</script>

</body>
</html>
