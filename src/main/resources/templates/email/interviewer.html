<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <title>Interviewer WebSocket 테스트</title>
</head>
<body>

<h2>면접관 WebSocket 테스트</h2>

<label>JWT Token: </label>
<input id="tokenInput" type="text" size="70" placeholder="여기에 JWT 입력"/>
<button onclick="connectWS()">Connect</button>

<hr/>

<button onclick="sendChat()">채팅 보내기</button>
<button onclick="sendNote()">노트 보내기</button>

<pre id="log"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stomp = null;

    function log(msg) {
        document.getElementById("log").textContent += msg + "\n";
    }

    function connectWS() {

        const jwtToken = document.getElementById("tokenInput").value;

        const socket = new SockJS("http://localhost:8080/ws/interview");
        stomp = Stomp.over(socket);

        stomp.connect(
            {
                Authorization: "Bearer " + jwtToken,   // ★ JWT 인증!
                interviewId: 10                        // ★ 인터뷰 ID
            },
            () => {
                log("면접관 연결 성공!");

                stomp.subscribe("/topic/interview/10/chat", msg => log("[CHAT] " + msg.body));
                stomp.subscribe("/topic/interview/10/system", msg => log("[SYSTEM] " + msg.body));
                stomp.subscribe("/topic/interview/10/note", msg => log("[NOTE] " + msg.body));
            },
            (err) => {
                log("연결 실패: " + err);
            }
        );
    }

    function sendChat() {
        stomp.send("/app/interview/10/chat", {}, JSON.stringify({
            senderId: 1,
            sender: "면접관",
            content: "면접관이 보낸 메시지"
        }));
        log("면접관 → 채팅 보냄");
    }

    function sendNote() {
        stomp.send("/app/interview/10/note", {}, JSON.stringify({
            senderId: 1,
            sender: "면접관",
            content: "면접관이 작성한 평가 노트",
            noteId: 100
        }));
        log("면접관 → 노트 보냄");
    }
</script>

</body>
</html>
